# Blueprint de Render para el backend Django de UNI-SIGEA.
# Al crear el servicio con "New > Blueprint" Render lee este archivo del repo.
services:
  - type: web
    name: uni-sigea-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: uni-sigea-db
          property: connectionString
      # Completar en el dashboard de Render después de crear el blueprint:
      # https://<tu-proyecto>.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Subida de documentos (Power Automate / Gemini)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: POWER_AUTOMATE_UPLOAD_URL
        sync: false
      - key: POWER_AUTOMATE_IDENTITY_UPLOAD_URL
        sync: false
      - key: POWER_AUTOMATE_IDENTITY_REQUIREMENT_IDS
        sync: false
      - key: POWER_AUTOMATE_BEARER_TOKEN
        sync: false
      # Render no ofrece disco persistente en el plan free:
      # los archivos subidos se pierden en cada deploy.
      - key: SERVE_MEDIA_FILES
        value: "true"

databases:
  - name: uni-sigea-db
    databaseName: sigea
    user: sigea
    plan: free
    region: oregon
